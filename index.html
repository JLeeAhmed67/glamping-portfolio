<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamping Portfolio</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f3;
            margin: 0;
        }

        header {
            background: #2d5a27;
            padding: 25px;
            text-align: center;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Glamping Portfolio</h1>
</header>

<section class="gallery">

    <div class="card">
        <img src="003205-03-tent-bathroom.jpg" alt="Tent Bathroom">
        <p>Tent Bathroom</p>
    </div>

    <div class="card">
        <img src="2-person-dome-tent.jpg" alt="Dome Tent">
        <p>Dome Tent</p>
    </div>

    <div class="card">
        <img src="images.jfif" alt="Glamping Image">
        <p>Glamping Image</p>
    </div>

    <div class="card">
        <img src="th (1).webp" alt="Outdoor Kitchen">
        <p>Outdoor Kitchen</p>
    </div>

</section>

</body>
</html>
